<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shorts pipeline</title>
<style>
  /* dark is the resting state of a render-monitoring tool; light is a faithful daytime variant */
  :root {
    --bg:#13161b; --panel:#1b1f27; --panel-2:#212630; --line:#2c333e;
    --ink:#d9dee6; --ink-dim:#8b929f;
    --run:#f0b45c; --run-tint:#2a2318;
    --ok:#63c2a4;  --ok-tint:#162420;
    --fail:#e0796f; --fail-tint:#2a1b19;
    --sel:#7aa7e0;
    /* the monitor is a screen: it stays dark in every theme */
    --mon-bg:#0f1216; --mon-ink:#cbd3dc; --mon-line:#20262e;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#eef0f2; --panel:#ffffff; --panel-2:#f5f6f8; --line:#d5d9df;
      --ink:#1f242b; --ink-dim:#667080;
      --run:#9c6716; --run-tint:#f7edd8;
      --ok:#1f7d61;  --ok-tint:#e3f1eb;
      --fail:#b23a30; --fail-tint:#f6e2df;
      --sel:#2f6cc4;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { color-scheme: dark light; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:880px; margin:0 auto; padding:22px 20px 96px; }
  a { color:var(--sel); text-decoration:none; }
  a:hover { text-decoration:underline; }
  h1 { font-size:21px; line-height:1.25; letter-spacing:-.01em; font-weight:600; margin:.1rem 0 .15rem; }
  textarea {
    width:100%; background:var(--panel-2); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:9px 10px;
    font:12.5px/1.5 var(--mono); resize:vertical;
  }
  input[type=text], input:not([type]) {
    background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:7px 9px; font:14px var(--sans);
  }
  :focus-visible { outline:2px solid var(--sel); outline-offset:2px; border-radius:3px; }

  .btn {
    font:13px var(--sans); font-weight:500; padding:6px 12px;
    border:1px solid var(--line); border-radius:6px;
    background:var(--panel-2); color:var(--ink); cursor:pointer;
  }
  .btn:hover:not(:disabled) { border-color:var(--ink-dim); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn-run { background:var(--run); border-color:var(--run); color:#20160a; font-weight:600; }
  .btn-run:hover:not(:disabled) { filter:brightness(1.07); }
  .btn-stop { background:transparent; border-color:var(--fail); color:var(--fail); }
  .btn-stop:hover:not(:disabled) { background:var(--fail-tint); }

  .muted { color:var(--ink-dim); }
  .err { color:var(--fail); }

  /* ---- top bar ---- */
  .topbar { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; }
  .wordmark { font:12px var(--mono); letter-spacing:.04em; color:var(--ink-dim); }
  .src { font-size:12.5px; }

  /* ---- section heading with a rule that runs to the edge ---- */
  .head { display:flex; align-items:center; gap:.7rem; margin:1.4rem 0 .65rem; }
  .head b { font-size:13px; font-weight:600; }
  .head .fill { flex:1; height:1px; background:var(--line); }

  /* ---- pipeline strip ---- */
  .strip {
    display:grid; grid-template-columns:repeat(6,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .seg {
    appearance:none; text-align:left; font:inherit; color:var(--ink);
    background:var(--panel); border:0; padding:8px 10px 9px;
    display:flex; flex-direction:column; gap:3px; min-height:50px;
    position:relative; cursor:pointer;
  }
  .seg:disabled { cursor:default; }
  .seg .idx { position:absolute; top:6px; right:8px; font:10px/1 var(--mono); color:var(--ink-dim); opacity:.7; }
  .seg .nm { font:13px/1.15 var(--mono); font-weight:600; }
  .seg .stt { font:11px/1 var(--mono); color:var(--ink-dim); }
  .seg.done { background:var(--ok-tint); }
  .seg.done .stt { color:var(--ok); }
  .seg.ready .stt { color:var(--sel); }
  .seg.stale { background:var(--run-tint); }
  .seg.stale .stt { color:var(--run); }
  .seg.blocked { background:var(--panel); opacity:.5; }
  .seg.armed:not(.running) { box-shadow: inset 0 0 0 2px var(--sel); }
  .seg.running {
    background:var(--run-tint); color:var(--ink);
    box-shadow: inset 0 0 0 2px var(--run);
  }
  .seg.running .stt { color:var(--run); font-weight:600; }
  .seg.running::after {
    content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--run), transparent);
    background-size:40% 100%; background-repeat:no-repeat;
    animation:sweep 1.6s linear infinite;
  }
  .seg.flash-ok { animation:flash 620ms ease-out 1; }
  .seg.flash-fail { animation:flashFail 620ms ease-out 1; }
  @keyframes sweep { from { background-position:-40% 0; } to { background-position:140% 0; } }
  @keyframes flash { 0% { box-shadow:inset 0 0 0 2px var(--ok), 0 0 22px var(--ok); } 100% { box-shadow:inset 0 0 0 1px var(--line); } }
  @keyframes flashFail { 0% { box-shadow:inset 0 0 0 2px var(--fail), 0 0 22px var(--fail); } 100% { box-shadow:inset 0 0 0 1px var(--line); } }

  /* ---- run/arm deck below the strip ---- */
  .deck {
    margin-top:11px; border:1px solid var(--line); border-radius:8px;
    background:var(--panel); padding:9px 13px;
    display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
  }
  .deck.armed { border-color:var(--sel); }
  .deck.running { border-color:var(--run); background:var(--run-tint); }
  .deck .d-stage { font:15px var(--mono); font-weight:600; }
  .deck .d-status { font:12px var(--mono); color:var(--ink-dim); }
  .deck.armed .d-status { color:var(--sel); }
  .deck .d-detail { font-size:12.5px; color:var(--ink-dim); flex:1 1 12rem; min-width:0; }
  .deck .d-elapsed { margin-left:auto; font:13px var(--mono); color:var(--run); font-variant-numeric:tabular-nums; }
  .deck .d-tail {
    flex:1 1 100%; font:11.5px var(--mono); color:var(--ink-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .deck .spacer { flex:1; }
  .deck label { font:12px var(--mono); color:var(--ink-dim); display:inline-flex; align-items:center; gap:.35rem; }
  .deck.idle { color:var(--ink-dim); font-size:12.5px; display:block; }

  /* ---- brief ---- */
  .brief-help { display:block; margin-top:.35rem; font-size:12.5px; color:var(--ink-dim); }
  #save-prompt { margin-top:.5rem; }

  /* ---- ideas ---- */
  .card { border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:12px 13px; margin:.55rem 0; }
  .card-top { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }
  .card-top .title-in { flex:1 1 14rem; font-size:15px; font-weight:600; padding:5px 8px; }
  .approve { font-size:12px; color:var(--ink-dim); display:inline-flex; align-items:center; gap:.35rem; white-space:nowrap; }
  .frow { display:flex; gap:.6rem; font:11.5px var(--mono); }
  .frow .fr { color:var(--ink-dim); }
  .frow .fr.fresh { color:var(--ok); }
  .frow .fr.stale { color:var(--run); }
  .field-lbl { display:block; margin:.6rem 0 .15rem; font:11px var(--mono); color:var(--ink-dim); }
  .card .tags-in { width:100%; font:12.5px var(--mono); padding:7px 9px; }
  .tabs { display:flex; gap:0; margin:.7rem 0 0; border-bottom:1px solid var(--line); }
  .tab {
    appearance:none; background:none; border:0; cursor:pointer;
    font:12px var(--mono); color:var(--ink-dim); padding:5px 10px;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab.on { color:var(--ink); border-bottom-color:var(--run); }
  .tab:hover:not(.on) { color:var(--ink); }
  .card textarea { margin:.55rem 0 .45rem; }
  .plan-err { display:block; margin-top:.35rem; font-size:12px; }

  /* ---- projects list ---- */
  .newproj { display:flex; flex-direction:column; gap:.55rem; max-width:26rem; margin:1rem 0 1.6rem; }
  .newproj label { font-size:12.5px; color:var(--ink-dim); }
  .newproj label input { display:block; width:100%; margin-top:.2rem; }
  .plist a.p-row {
    display:flex; align-items:center; gap:.8rem; padding:.6rem .1rem;
    border-bottom:1px solid var(--line); color:var(--ink);
  }
  .plist a.p-row:hover { text-decoration:none; color:var(--sel); }
  .plist .p-name { font-weight:600; }
  .plist .p-title { flex:1; font-size:12.5px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini { display:inline-grid; grid-template-columns:repeat(6,7px); gap:2px; }
  .mini i { height:14px; border-radius:1px; background:var(--line); }
  .mini i.done { background:var(--ok); }
  .mini i.stale { background:var(--run); }
  .mini i.ready { background:var(--sel); }

  /* ---- monitor: persists across re-renders; pins to the foot only while a stage runs ---- */
  #monitor {
    margin-top:1.4rem; border:1px solid var(--mon-line); border-radius:8px; overflow:hidden;
    background:var(--mon-bg);
  }
  #monitor.pinned {
    position:sticky; bottom:8px;
    box-shadow:0 12px 28px -14px rgba(0,0,0,.6);
  }
  #monitor.pinned #log { height:150px; }
  .mon-head {
    display:flex; align-items:center; gap:.6rem;
    background:var(--mon-bg); color:var(--mon-ink);
    border-bottom:1px solid var(--mon-line); padding:6px 12px;
    font:12px var(--mono);
  }
  .mon-head .live { color:var(--run); display:inline-flex; align-items:center; gap:.35rem; }
  .mon-head .live::before {
    content:""; width:7px; height:7px; border-radius:50%; background:var(--run);
    animation:blink 1.3s ease-in-out infinite;
  }
  .mon-when { margin-left:auto; color:var(--mon-ink); opacity:.6; }
  #log {
    margin:0; background:var(--mon-bg); color:var(--mon-ink);
    padding:11px 12px; height:200px; overflow:auto;
    font:12.5px/1.5 var(--mono); white-space:pre-wrap; word-break:break-word;
  }
  #log:empty::before { content:"Waiting for a stage to run."; color:#5b6470; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }

  /* ---- top progress bar ---- */
  #bar { position:fixed; inset:0 0 auto 0; height:2px; background:var(--run-tint); z-index:9; overflow:hidden; }
  #bar::after {
    content:""; position:absolute; inset:0; width:32%; background:var(--run);
    animation:track 1.15s ease-in-out infinite;
  }
  @keyframes track { 0% { left:-32%; } 100% { left:100%; } }

  /* ---- idea card audio ---- */
  .card audio { width:100%; height:34px; margin:.5rem 0 0; display:block; }

  /* ---- assets panel ---- */
  .assets summary { font-size:13px; font-weight:600; cursor:pointer; }
  .assets .hint { margin:.35rem 0 .6rem; font-size:12.5px; color:var(--ink-dim); }
  .cat { border:1px solid var(--line); border-radius:6px; padding:9px 11px; margin:.45rem 0; }
  .cat-head { display:flex; align-items:baseline; gap:.6rem; }
  .cat-head .nm { font:13px var(--mono); font-weight:600; }
  .cat-head .n { font:11.5px var(--mono); color:var(--ink-dim); margin-left:auto; }
  .cat-head .n.empty { color:var(--fail); }
  .cat ul { margin:.4rem 0 0; padding-left:1.1rem; }
  .cat li { font-size:12.5px; color:var(--ink-dim); margin:.15rem 0; }

  /* ---- toasts ---- */
  #toasts { position:fixed; right:14px; bottom:14px; z-index:20; display:flex; flex-direction:column; gap:.4rem; }
  .toast {
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-left:3px solid var(--ok); border-radius:6px; padding:8px 12px;
    font-size:12.5px; box-shadow:0 8px 20px -10px rgba(0,0,0,.5);
    animation:toast-in .18s ease-out;
  }
  .toast.err { border-left-color:var(--fail); }
  @keyframes toast-in { from { opacity:0; transform:translateY(6px); } }

  @media (max-width:680px) {
    .strip { grid-template-columns:1fr; }
    .seg { flex-direction:row; align-items:center; gap:.6rem; min-height:0; padding:10px 12px; }
    .seg .idx { order:0; }
    .seg .stt { margin-top:0; margin-left:auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .seg.running::after { animation:none; background:var(--run); }
    .seg.flash-ok, .seg.flash-fail { animation:none; }
    .mon-head .live::before { animation:none; }
    #bar::after { animation:none; left:0; width:100%; }
    .toast { animation:none; }
  }
</style>

<div class="wrap">
  <div id="app">Loading…</div>

  <section id="monitor">
    <div class="mon-head">
      <span>Monitor</span>
      <span class="live" hidden>live</span>
      <span class="mon-when"></span>
    </div>
    <pre id="log"></pre>
  </section>
</div>
<div id="bar" hidden></div>
<div id="toasts"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const STAGES = ["fetch", "transcribe", "ideate", "voice", "plan", "render"];

const api = async (method, path, body) => {
  const r = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "untitled";
}
function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "err" ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 4000 : 2500);
}

let state = null;
let currentProject = null;
let armed = null;         // stage name the user has selected to run
let pending = false;      // Run clicked, waiting for the stream to confirm
let startedAt = 0;        // ms epoch of the running/pending job
let lastLine = "";        // most recent non-empty log line, for the deck tail
let ticker = null;
let poller = null;        // fallback GET /api/jobs/current while a job is believed running
let assetsOpen = false;   // keep the Assets panel open across re-renders
const creating = new Set();

function jobHereRunning() {
  return !!(state && state.job && state.job.running && state.job.project === state.name);
}

/* ---------- routing ---------- */
function route() {
  const hash = decodeURIComponent(location.hash.slice(2));
  currentProject = hash || null;
  armed = null;
  if (currentProject) loadProject(currentProject);
  else loadList();
}

/* ---------- projects list ---------- */
async function loadList() {
  let rows;
  try { rows = await api("GET", "/api/projects"); }
  catch (err) {
    $("#app").innerHTML =
      `<p class="err">${escapeHtml(err.message)}</p><p><a href="#/" onclick="route()">Try again</a></p>`;
    return;
  }
  const list = rows.map((p) => {
    const cells = STAGES.map((st) => `<i class="${p.stages && p.stages[st] || ""}"></i>`).join("");
    return `<a class="p-row" href="#/${encodeURIComponent(p.name)}">
      <span class="mini">${cells}</span>
      <span class="p-name">${escapeHtml(p.name)}</span>
      <span class="p-title">${escapeHtml(p.title || "")}</span>
    </a>`;
  }).join("") || `<p class="muted">No projects yet. Create one above.</p>`;

  $("#app").innerHTML = `
    <div class="topbar"><span class="wordmark">shorts pipeline</span></div>
    <h1>Projects</h1>
    <form class="newproj" id="new">
      <label>Project name<input name="name" required></label>
      <label>YouTube URL<input name="url" required></label>
      <button class="btn btn-run">Create project</button>
    </form>
    <div class="plist">${list}</div>`;

  $("#new").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const slug = slugify(f.name.value);
    try {
      await api("POST", "/api/projects", { name: f.name.value, url: f.url.value });
      creating.add(slug);
      location.hash = "#/" + encodeURIComponent(slug);
    } catch (err) { alert(err.message); }
  };
}

/* ---------- one project ---------- */
async function loadProject(name) {
  try {
    state = await api("GET", `/api/projects/${encodeURIComponent(name)}`);
  } catch (err) {
    if (creating.has(name) && /no such project/i.test(err.message)) {
      $("#app").innerHTML = `
        <div class="topbar"><a href="#/">‹ Projects</a>
          <span class="wordmark">shorts / ${escapeHtml(name)}</span></div>
        <h1>${escapeHtml(name)}</h1>
        <div class="deck running"><span class="d-stage">fetch</span>
          <span class="d-status">downloading the source video…</span></div>`;
      setBusy(true);
      return;
    }
    $("#app").innerHTML =
      `<p class="err">${escapeHtml(err.message)}</p><p><a href="#/">‹ Projects</a></p>`;
    return;
  }
  creating.delete(name);
  if (jobHereRunning()) {
    startedAt = Date.parse(state.job.started_at) || startedAt || Date.now();
  }
  render();
}

/* ---------- render ---------- */
function render() {
  if (!state) return;
  const s = state;
  const runningHere = jobHereRunning();

  // pick the next actionable stage; auto-arm it if the user hasn't chosen one
  const runnable = (st) => st.stage !== "fetch" && st.status !== "blocked";
  const next = s.stages.find((st) => st.stage !== "fetch" && (st.status === "ready" || st.status === "stale"));
  if (!armed && next) armed = next.stage;
  const armedRow = s.stages.find((st) => st.stage === armed && runnable(st)) || null;

  const srcUrl = s.source.url || "";
  const srcLink = /^https?:\/\//i.test(srcUrl)
    ? ` &nbsp;<a class="src" href="${escapeHtml(srcUrl)}">source</a>`
    : (srcUrl ? ` &nbsp;<span class="src muted">${escapeHtml(srcUrl)}</span>` : "");

  $("#app").innerHTML = `
    <div class="topbar">
      <a href="#/">‹ Projects</a>
      <span class="wordmark">shorts / ${escapeHtml(s.name)}</span>
    </div>
    <h1>${escapeHtml(s.source.title || s.name)}</h1>
    <p class="muted" style="margin:.1rem 0 0">${escapeHtml(s.name)}${srcLink}</p>

    <div class="head"><b>Pipeline</b><span class="fill"></span></div>
    <div class="strip">${s.stages.map((st, i) => segment(st, i, runningHere)).join("")}</div>
    ${deck(s, armedRow, runningHere)}

    <div class="head"><b>Brief</b><span class="fill"></span></div>
    <textarea id="prompt" rows="5">${escapeHtml(s.prompt)}</textarea>
    <button class="btn" id="save-prompt">Save brief</button>
    <span class="brief-help">Ideate reads this the next time it runs.</span>

    <div class="head"><b>Ideas</b><span class="fill"></span></div>
    ${s.ideas.map(ideaCard).join("") ||
      `<p class="muted">No ideas yet. Run ideate to generate them.</p>`}

    <div class="head"><b>Assets</b><span class="fill"></span></div>
    <details class="assets" ${assetsOpen ? "open" : ""}>
      <summary>Categories &amp; coverage</summary>
      <p class="hint">Footage each plan beat asks for, and how many files are on hand.</p>
      <div id="cats" class="muted">Open to load.</div>
    </details>`;

  setBusy(runningHere || pending);
  syncMonitor(runningHere);
  if (runningHere || pending) { startTicker(); ensurePoller(); } else stopTicker();
  wire();
  if (assetsOpen) loadCategories();
}

function segment(st, i, runningHere) {
  const isRun = runningHere && state.job.stage === st.stage;
  const armable = st.stage !== "fetch" && st.status !== "blocked";
  const cls = ["seg", st.status];
  if (isRun) cls.push("running");
  else if (!runningHere && armed === st.stage && armable) cls.push("armed");
  const label = isRun ? "running" : st.status;
  return `<button class="${cls.join(" ")}" data-stage="${st.stage}" ${armable ? "" : "disabled"}
      aria-label="${st.stage} — ${label}">
    <span class="idx">${i + 1}</span>
    <span class="nm">${st.stage}</span>
    <span class="stt">${label}</span>
  </button>`;
}

function deck(s, armedRow, runningHere) {
  if (runningHere || pending) {
    const stage = runningHere ? s.job.stage : armed;
    return `<div class="deck running" aria-live="polite">
      <span class="d-stage">${escapeHtml(stage || "")}</span>
      <span class="d-elapsed" id="elapsed">0:00</span>
      <button class="btn btn-stop" id="stop">Stop</button>
      <span class="d-tail" id="tail">${escapeHtml(pending && !runningHere ? "starting…" : (lastLine || "…"))}</span>
    </div>`;
  }
  if (s.job && s.job.running) {
    return `<div class="deck idle" aria-live="polite">A job is running on
      <b>${escapeHtml(s.job.project)}</b>. Wait for it to finish before starting another.</div>`;
  }
  if (armedRow) {
    const st = armedRow;
    const detail = st.status === "done"
      ? (st.detail || "Up to date. Run with force to rebuild it.")
      : (st.detail || "");
    return `<div class="deck armed" aria-live="polite">
      <span class="d-stage">${st.stage}</span>
      <span class="d-status">${st.status}</span>
      <span class="d-detail">${escapeHtml(detail)}</span>
      <span class="spacer"></span>
      <label><input type="checkbox" id="armforce"> force</label>
      <button class="btn btn-run" id="armrun">Run ${st.stage}</button>
    </div>`;
  }
  return `<div class="deck idle">Every stage is current. Edit an idea or the brief, then a stage will offer to re-run.</div>`;
}

const ideaView = new Map(); // slug -> "idea" | "plan"

function ideaCard(idea) {
  const fr = (k) => `<span class="fr ${idea[k]}">${idea[k] === "fresh" ? "●" : idea[k] === "stale" ? "◐" : "○"} ${k}</span>`;
  const hasPlan = !!idea.plan_json;
  const showPlan = hasPlan && (ideaView.get(idea.slug) || "plan") === "plan";

  const tabs = hasPlan
    ? `<div class="tabs">
        <button class="tab ${showPlan ? "" : "on"}" data-view="idea">Idea</button>
        <button class="tab ${showPlan ? "on" : ""}" data-view="plan">Plan</button>
       </div>`
    : `<label class="field-lbl">narration</label>`;

  const planBlock = hasPlan
    ? `<div class="pane-plan" ${showPlan ? "" : "hidden"}>
        <textarea class="plan" rows="12">${escapeHtml(JSON.stringify(idea.plan_json, null, 2))}</textarea>
        <button class="btn save-plan">Save plan</button><span class="plan-err err"></span>
       </div>`
    : "";

  const audio = idea.voice !== "missing"
    ? `<audio controls preload="none" src="/api/projects/${encodeURIComponent(state.name)}/voice/${encodeURIComponent(idea.slug)}?h=${encodeURIComponent(idea.voice_hash || "")}"></audio>`
    : "";

  return `<div class="card" data-slug="${escapeHtml(idea.slug)}">
    <div class="card-top">
      <input class="title-in" value="${escapeHtml(idea.title)}" aria-label="video title">
      <label class="approve"><input type="checkbox" class="approved" ${idea.approved ? "checked" : ""}> approved</label>
      <span class="frow">${fr("voice")}${fr("plan")}${fr("render")}</span>
    </div>
    ${audio}
    <label class="field-lbl">description</label>
    <textarea class="desc-in" rows="2">${escapeHtml(idea.description || "")}</textarea>
    <label class="field-lbl">tags &nbsp;<span class="muted">comma-separated, for the YouTube upload</span></label>
    <input class="tags-in" value="${escapeHtml(idea.tags || "")}" aria-label="youtube tags">
    <button class="btn save-idea">Save idea</button>
    ${tabs}
    <textarea class="narration" rows="5" ${showPlan ? "hidden" : ""}>${escapeHtml(idea.narration)}</textarea>
    ${planBlock}
  </div>`;
}

/* ---------- run controls ---------- */
async function runStage(stage, force) {
  if (pending || jobHereRunning()) return;
  pending = true;
  startedAt = Date.now();
  lastLine = "";
  render();
  try {
    await api("POST", `/api/projects/${encodeURIComponent(state.name)}/run/${stage}`, { force });
  } catch (err) {
    pending = false;
    render();
    toast(err.message, "err");
  }
}

function wire() {
  document.querySelectorAll(".seg[data-stage]").forEach((b) => {
    if (b.disabled) return;
    b.onclick = () => { armed = b.dataset.stage; render(); };
  });
  const armrun = $("#armrun");
  if (armrun) armrun.onclick = () => runStage(armed, $("#armforce").checked);
  const stop = $("#stop");
  if (stop) stop.onclick = () => {
    stop.disabled = true;
    api("POST", "/api/jobs/current/cancel").catch((e) => { stop.disabled = false; toast(e.message, "err"); });
  };

  $("#save-prompt").onclick = async () => {
    try {
      state = await api("PUT", `/api/projects/${encodeURIComponent(state.name)}/prompt`,
        { prompt: $("#prompt").value });
      render();
      toast("Brief saved");
    } catch (err) { toast(err.message, "err"); }
  };

  const cats = $(".assets");
  if (cats) cats.ontoggle = () => {
    assetsOpen = cats.open;
    if (cats.open) loadCategories();
  };

  document.querySelectorAll(".card").forEach((card) => {
    const slug = card.dataset.slug;
    card.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
      ideaView.set(slug, t.dataset.view);
      render();
    });
    $(".approved", card).onchange = async (e) => {
      const want = e.target.checked;
      try {
        state = await api("PUT",
          `/api/projects/${encodeURIComponent(state.name)}/ideas/${encodeURIComponent(slug)}/approved`,
          { approved: want });
        render();
        toast(want ? "Marked approved" : "Marked not approved");
      } catch (err) {
        e.target.checked = !want;
        toast(err.message, "err");
      }
    };
    $(".save-idea", card).onclick = async () => {
      try {
        state = await api("PUT", `/api/projects/${encodeURIComponent(state.name)}/ideas/${encodeURIComponent(slug)}`, {
          title: $(".title-in", card).value,
          description: $(".desc-in", card).value,
          tags: $(".tags-in", card).value,
          narration: $(".narration", card).value,
          approved: $(".approved", card).checked,
        });
        render();
        toast("Idea saved");
      } catch (err) { toast(err.message, "err"); }
    };
    const sp = $(".save-plan", card);
    if (sp) sp.onclick = async () => {
      $(".plan-err", card).textContent = "";
      try {
        state = await api("PUT", `/api/projects/${encodeURIComponent(state.name)}/ideas/${encodeURIComponent(slug)}/plan`, {
          plan: $(".plan", card).value,
        });
        render();
        toast("Plan saved");
      } catch (err) { $(".plan-err", card).textContent = err.message; }
    };
  });
}

async function loadCategories() {
  const box = $("#cats");
  if (!box) return;
  box.textContent = "Loading…";
  let rows;
  try { rows = await api("GET", `/api/projects/${encodeURIComponent(state.name)}/categories`); }
  catch (err) { box.textContent = err.message; return; }
  if (!rows.length) { box.textContent = "No asset folders or plan categories yet."; return; }
  box.classList.remove("muted");
  box.innerHTML = rows.map((r) => {
    const n = r.assets === 1 ? "1 file" : `${r.assets} files`;
    const need = r.assets === 0 && r.beats.length ? " empty" : "";
    const list = r.beats.length
      ? `<ul>${r.beats.map((b) => `<li>${escapeHtml(b)}</li>`).join("")}</ul>`
      : `<p class="hint" style="margin:.35rem 0 0">Not used by any plan yet.</p>`;
    return `<div class="cat">
      <div class="cat-head"><span class="nm">${escapeHtml(r.category)}</span>
        <span class="n${need}">${n}</span></div>
      ${list}
    </div>`;
  }).join("");
}

/* ---------- poll fallback: catch a job that ended while SSE was reconnecting ---------- */
function ensurePoller() {
  if (poller) return;
  poller = setInterval(async () => {
    if (!pending && !jobHereRunning()) { clearInterval(poller); poller = null; return; }
    try {
      const j = await api("GET", "/api/jobs/current");
      if (!j.running && (pending || jobHereRunning())) {
        pending = false;
        if (currentProject) loadProject(currentProject);
      }
    } catch { /* transient; try again next tick */ }
  }, 4000);
}

/* ---------- elapsed timer ---------- */
function startTicker() {
  if (ticker) return;
  ticker = setInterval(() => {
    const el = $("#elapsed");
    if (!el || (!jobHereRunning() && !pending)) { stopTicker(); return; }
    el.textContent = fmt(Date.now() - startedAt);
  }, 1000);
}
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

/* ---------- chrome that lives outside #app ---------- */
function setBusy(on) { $("#bar").hidden = !on; }
function syncMonitor(runningHere) {
  $(".live").hidden = !runningHere;
  $("#monitor").classList.toggle("pinned", runningHere || pending);
  if (runningHere) $(".mon-when").textContent = "";
}
function flashSegment(stage, ok) {
  const seg = document.querySelector(`.seg[data-stage="${stage}"]`);
  if (!seg) return;
  const c = ok ? "flash-ok" : "flash-fail";
  seg.classList.add(c);
  setTimeout(() => seg.classList.remove(c), 700);
}

/* ---------- live stream ---------- */
const log = $("#log");
const es = new EventSource("/api/jobs/current/stream");
es.onmessage = (e) => {
  let ev;
  try { ev = JSON.parse(e.data); } catch { return; }

  if (ev.type === "line") {
    log.textContent += ev.text + "\n";
    log.scrollTop = log.scrollHeight;
    if (ev.text.trim()) {
      lastLine = ev.text.trim();
      const tail = $("#tail");
      if (tail) tail.textContent = lastLine;
    }
    return;
  }
  if (ev.type !== "status") return;

  if (ev.state === "running") {
    log.textContent = "";
    lastLine = "";
    pending = false;
    if (ev.started_at) startedAt = Date.parse(ev.started_at) || startedAt;
    if (currentProject) loadProject(currentProject);
  } else if (ev.state === "exited") {
    // only narrate if we were actually tracking this run — a replayed `exited`
    // on a fresh page load should just reconcile, silently
    const wasTracking = pending || jobHereRunning();
    if (wasTracking) {
      const ok = ev.returncode === 0;
      const runStage = state && state.job ? state.job.stage : null;
      log.textContent += `\n— ${ok ? "finished" : `failed · exit ${ev.returncode}`} in ${fmt(Date.now() - startedAt)} —\n`;
      log.scrollTop = log.scrollHeight;
      $(".mon-when").textContent = ok ? `done in ${fmt(Date.now() - startedAt)}` : `failed · exit ${ev.returncode}`;
      if (runStage) flashSegment(runStage, ok);
    }
    pending = false;
    armed = null;
    stopTicker();
    if (currentProject) loadProject(currentProject);
  } else if (ev.state === "idle") {
    setBusy(false);
    $(".live").hidden = true;
    // a job finished while the stream was reconnecting and we missed `exited`
    if (pending || jobHereRunning()) {
      pending = false;
      if (currentProject) loadProject(currentProject);
    }
  }
};
es.onerror = () => {
  log.textContent += "\n— stream lost, reconnecting… —\n";
  log.scrollTop = log.scrollHeight;
};

window.addEventListener("hashchange", route);
route();
</script>
